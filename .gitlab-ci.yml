---
stages:
  - lint
  - build

include:
  - project: opentalk/ci/templates/common-lint
    ref: v1
    file: .gitlab-ci-template.yml

build:tagger-image:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  image:
    name: quay.io/buildah/stable:v1.43.0
    pull_policy: if-not-present
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Tag the helper image with a stable identifier matching the template ref
    # so consumers that pin `ref: v2` get a reproducible runtime image.
    - |
      TAGS=("latest" "v2")
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS+=("$CI_COMMIT_TAG")
      fi
      BUILD_ARGS=()
      for t in "${TAGS[@]}"; do
        BUILD_ARGS+=("-t" "$CI_REGISTRY_IMAGE:$t")
      done
      buildah build "${BUILD_ARGS[@]}" .
      for t in "${TAGS[@]}"; do
        buildah push "$CI_REGISTRY_IMAGE:$t"
      done
