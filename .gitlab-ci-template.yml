---
spec:
  inputs:
    dockerfile_dir:
      default: $CI_PROJECT_DIR

---
package:container-build-mr:
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  stage: package
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
  image:
    name: quay.io/buildah/stable:v1.42.0
    pull_policy: if-not-present
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      if [[ $FLAVOR == "" ]]; then
        DOCKERFILE="Dockerfile"
        TAG="$CI_COMMIT_REF_SLUG"
      else
        DOCKERFILE="Dockerfile-$FLAVOR"
        TAG="$CI_COMMIT_REF_SLUG-$FLAVOR"
      fi
    - buildah build -f $[[ inputs.dockerfile_dir ]]/$DOCKERFILE -t "$CI_REGISTRY_IMAGE:$TAG"
    - buildah push "$CI_REGISTRY_IMAGE:$TAG"

package:container-build:
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image:
    name: quay.io/buildah/stable:v1.42.0
    pull_policy: if-not-present
  before_script:
    - buildah login -u "$CI_REGISTRY_USER" --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - IMAGE_TAG=$FLAVOR-$CI_COMMIT_SHORT_SHA
    - buildah build -f $[[ inputs.dockerfile_dir ]]/Dockerfile-$FLAVOR -t $CI_REGISTRY_IMAGE:$IMAGE_TAG
    - buildah push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
